# Основные метаданные сайта
site_name: Мой Блог
site_url: https://Kvezac.github.io/mkdocs-demo/
site_author: Ваше имя

# Copyright в футере (только твой текст, без лишнего)
# copyright: © 2025 Тряпышко Андрей
hooks:
  - hooks.py
# Тема оформления
theme:
  name: material
  language: ru

  # Цветовая палитра — тёмная тема по умолчанию + переключатель на светлую
  palette:
    # Тёмная (slate) — основная / по умолчанию
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7 # Солнышко — переключить на светлую
        name: Переключиться на светлую тему

    # Светлая — только как запасная опция
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4 # Луна — переключить на тёмную
        name: Переключиться на тёмную тему

  # Полезные функции темы
  features:
    #   - navigation.sections
    #   - navigation.tracking
    #   - navigation.footer
    #   - toc.integrate
    - content.code.copy
  #   - content.code.annotate
  #   - search.suggest
  #   - search.highlight

# Ключевой блок: полностью убирает "Made with Material for MkDocs"
extra:
  generator: false # ← это удаляет надпись навсегда

  # Социальные иконки в футере справа (настрой свои ссылки)
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kvezac
    - icon: fontawesome/brands/telegram
      link: https://t.me/ # ← замени на реальный

# Репозиторий + кнопка "Редактировать"
repo_url: https://github.com/Kvezac/mkdocs-demo
repo_name: Kvezac/mkdocs-demo
edit_uri: edit/main/docs/

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Следить за изменениями
watch:
  - docs

# Навигация
nav:
  - Главная: index.md
  - Обо Мне: about.md
  - Шпаргалка Linux: linux.md
  - Настройка терминала: terminal.md
